# Configurazione del ranking. Modifica i numeri e rigenera: nessun valore è nel codice.
# Tutti i voti sono su scala 0-10 (Letterboxd x2, IMDb e Trakt invariati).

profile:
  # Smorzamento: peso(f) = somma(segnale_i) / (n_f + k). Più k è alto, meno contano le caratteristiche viste poche volte.
  k: 3
  # segnale_i = (mio_voto - voto_medio_TMDB) + lambda * (mio_voto - mia_media_voti)
  lambda: 1.5     # set C della ricerca (src/tune.js, reports/tuning.md)

# Pesi delle caratteristiche nell'affinità T (somma 1.0)
affinity:
  weights:
    genres: 0.132
    directors: 0.134  # registi (film) / creatori (serie)
    cast: 0.170       # primi 5 attori
    countries: 0.0    # azzerato: in validazione leave-one-out correla negativamente (-0.17)
    decade: 0.139
    keywords: 0.425   # keyword TMDB, media dei pesi delle keyword presenti
  # Se un titolo ha una caratteristica mai incontrata nel profilo, contribuisce 0 (neutro).
  # Quanto è ripida la sigmoide che porta T in 0-1 (più alto = più contrasto)
  sigmoid_steepness: 0.52

# Qualità Q: media bayesiana TMDB
quality:
  m: 500            # voti "di prior"
  global_mean: 6.5  # media di riferimento C
  floor: 5          # voto che vale Q=0
  ceiling: 10       # voto che vale Q=1

# Punteggio finale = 100 * (w_taste * T + w_quality * Q)
score:
  movie:  { taste: 0.609, quality: 0.391 }
  # Poche serie votate: il gusto pesa meno finché non ce ne sono di più
  tv:     { taste: 0.40, quality: 0.60 }
  # Sotto questo numero di serie votate si usa il peso "tv"; sopra, quello "movie"
  tv_min_rated_for_movie_weights: 15

# Fasce per percentile sulla watchlist (dall'alto). Le quote sommano 1.0
bands:
  - { name: "Assolutamente da vedere", short: "Imperdibile", share: 0.10 }
  - { name: "Molto probabile", short: "Probabile",         share: 0.25 }
  - { name: "Forse", short: "Forse",                   share: 0.35 }
  - { name: "Rimandabile", short: "Rimandabile",             share: 0.30 }

# Suggeriti fuori dalla watchlist
suggestions:
  seed_top_rated: 40         # partenza dai titoli votati più alto
  seed_top_rated_tv: 8       # seed aggiuntivi: le serie votate più alto (altrimenti i film le sommergono)
  min_vote_count: 1000       # scarta i film con meno voti TMDB
  min_vote_count_tv: 300     # soglia separata per le serie (su TMDB hanno meno voti)
  max_items: 100
  top_directors: 10          # altre opere dei registi con peso più alto
  # Per ogni seed: raccomandazioni e "simili" TMDB
  sources: [recommendations, similar, top_director_filmography]

# Importazione e matching
matching:
  year_tolerance: 2          # anno Letterboxd/TMDB: differenza massima accettata (uscita festival vs nazionale)

tmdb:
  language: it-IT
  region: IT
  providers_refresh_days: 7

trakt:
  # Una serie esce dalla watchlist quando gli episodi visti / episodi totali (TMDB) raggiungono questa quota.
  # Una serie con voto su Trakt è invece sempre considerata vista.
  show_completion_ratio: 0.9

# Addon Stremio/Nuvio (solo cataloghi)
addon:
  base_url: "https://lamaslamas.github.io/watchlist"   # dove Pages serve il sito (serve solo per mostrare l'URL da installare)
  short_runtime_max: 100        # catalogo "Sotto i 100 minuti" (solo film)
  directors_min_seen: 2         # "Registi che ami": registi con almeno N titoli votati...
  directors_top: 15             # ...e tra i primi N per peso nel profilo
  suggestions_movie: 100        # suggeriti film nel catalogo
  suggestions_tv: 50            # suggeriti serie nel catalogo (separati dal ranking del sito)


# Occasioni: pulsanti sotto la barra di ricerca del sito. Nomi dei generi in italiano (come li dà TMDB), keyword in inglese.
occasions:
  # "In famiglia": classificazione per età adatta a tutti, niente generi esclusi, premia i generi preferiti
  family:
    # Valori TMDB ammessi. IT: T = per tutti, 6+ = dai 6 anni. US: G, PG e le sigle TV.
    certifications:
      IT: ["T", "6+"]
      US: ["G", "PG", "TV-Y", "TV-Y7", "TV-G", "TV-PG"]
    # In Italia "T" è molto permissivo (passa anche Bastardi senza gloria): con strict anche la classificazione US,
    # se presente, deve essere tra quelle ammesse. Con false conta solo quella IT (US solo se manca l'IT).
    strict: true
    exclude_genres: ["Horror", "Crime", "Thriller", "Guerra"]
    # Keyword TMDB (inglese) che escludono il titolo: la classificazione per età da sola lascia passare molti film per adulti
    exclude_keywords: ["murder", "serial killer", "rape", "torture", "suicide", "drugs", "drug dealer", "prostitute", "gore", "violence", "brutality", "sex", "nudity", "erotic", "alcoholism", "addiction"]
    # Serve almeno uno di questi generi (lista vuota = nessun obbligo): "T" in Italia passa anche Stalker o La strada, quindi la sola età non basta
    require_genres: ["Animazione", "Avventura", "Commedia", "Famiglia", "Fantasy"]
    # Senza alcuna classificazione: "genres" ammette solo i titoli con uno di questi generi, "none" li esclude
    unknown: genres
    unknown_genres: ["Animazione", "Famiglia"]
    # Nell'ordinamento per ranking, con "In famiglia" attivo, questi generi aggiungono punti al punteggio
    prefer_genres: ["Animazione", "Avventura", "Commedia", "Famiglia"]
    prefer_bonus: 6
  # "Con la mia compagna": regole di esclusione. In più c'è il pulsante "Scelti insieme" (lista Trakt "insieme")
  partner:
    exclude_genres: ["Horror"]
    max_runtime: 150          # minuti, solo per i film
    together_list: "insieme"  # nome della lista personale su Trakt
  # Umore: un titolo è "leggero" o "impegnativo" se uno dei due punteggi supera l'altro di almeno `margin`
  mood:
    genre_weight: 1
    keyword_weight: 0.5
    margin: 1
    light:
      genres: ["Commedia", "Animazione", "Famiglia", "Avventura", "Musica"]
      keywords: ["hilarious", "amused", "feel good", "heartwarming", "whimsical", "lighthearted", "buddy comedy", "parody", "slapstick", "friendship", "road trip", "romantic comedy", "cheerful", "playful", "adventure"]
    heavy:
      genres: ["Dramma", "Guerra", "Storia", "Documentario", "War & Politics"]
      keywords: ["based on true story", "dystopia", "psychological drama", "psychological thriller", "suicide", "rape", "torture", "mental illness", "loss of loved one", "dying and death", "depressing", "disturbed", "tragic", "melancholy", "racism", "holocaust", "world war ii", "grief", "philosophical", "tragedy", "dramatic", "intense", "complex"]
  short_runtime: 100          # pulsante "Sotto 100 min" (solo film)
