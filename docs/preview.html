<!doctype html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>watchlist — pagina di prova</title>
<meta name="theme-color" content="#0d0d0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2.5 2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></symbol>
</svg>

<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="./preview.html" aria-label="watchlist">watchlist</a>
    <nav class="tabs" role="tablist" aria-label="Sezioni">
      <button class="tab" role="tab" id="tab-wl" aria-selected="true">La mia watchlist<span class="n" id="n-wl"></span></button>
      <button class="tab" role="tab" id="tab-sg" aria-selected="false">Suggeriti per te<span class="n" id="n-sg"></span></button>
    </nav>
    <span class="spacer"></span>
    <button class="icon-btn" id="theme" aria-label="Cambia tema chiaro/scuro" title="Tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
    </button>
  </div>
  <div class="wrap">
    <div class="toolbar" role="search">
      <label class="search"><span class="sr">Cerca titolo, regista o attore</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input class="field" id="q" type="search" placeholder="Cerca titolo, regista, attore" autocomplete="off">
      </label>
      <div class="quick">
        <div class="seg" role="group" aria-label="Tipo">
          <button data-media="" aria-pressed="true">Tutti</button><button data-media="movie" aria-pressed="false">Film</button><button data-media="tv" aria-pressed="false">Serie</button>
        </div>
        <select class="select" id="f-prov" aria-label="Piattaforma"></select>
        <select class="select" id="f-dur" aria-label="Durata">
          <option value="">Qualsiasi durata</option><option value="100">Sotto i 100 min</option><option value="120">Sotto i 120 min</option><option value="150">Sotto i 150 min</option>
        </select>
      </div>
      <button class="btn-filters" id="open-filters" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        Filtri <span class="badge" id="fbadge" hidden>0</span>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="summary" id="summary" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
  <footer>
    Pagina di prova con 20 titoli reali della tua watchlist e 8 suggeriti. Il punteggio combina i tuoi gusti con la qualità media del pubblico.
    <br>Dati, locandine e piattaforme: TMDB. Questo prodotto usa le API di TMDB ma non è approvato né certificato da TMDB.
  </footer>
</main>

<div class="scrim" id="scrim"></div>

<aside class="sheet panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" aria-hidden="true">
  <div class="panel-head"><h2 id="panel-title">Filtri</h2><button class="icon-btn" id="close-filters" aria-label="Chiudi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="group"><span class="lbl">Ordina per</span>
    <div class="chips" id="g-sort">
      <button class="pill" data-sort="rank" aria-pressed="true">Ranking</button><button class="pill" data-sort="year" aria-pressed="false">Anno</button><button class="pill" data-sort="runtime" aria-pressed="false">Durata</button><button class="pill" data-sort="vote" aria-pressed="false">Voto medio</button>
    </div></div>
  <div class="group"><span class="lbl">Fascia</span><div class="chips" id="g-band"></div></div>
  <div class="group"><label for="f-genre">Genere</label><select class="select" id="f-genre"></select></div>
  <div class="group"><label for="f-decade">Decennio</label><select class="select" id="f-decade"></select></div>
  <div class="group"><label for="f-country">Paese</label><select class="select" id="f-country"></select></div>
  <div class="group"><label for="f-dir">Regista</label><input class="field" id="f-dir" list="dl-dir" placeholder="Nome del regista" autocomplete="off"><datalist id="dl-dir"></datalist></div>
  <div class="group"><label for="f-actor">Attore</label><input class="field" id="f-actor" list="dl-actor" placeholder="Nome dell'attore" autocomplete="off"><datalist id="dl-actor"></datalist></div>
  <div class="panel-foot"><button class="btn" id="reset">Azzera</button><button class="btn primary" id="apply">Mostra</button></div>
</aside>

<article class="sheet detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="d-title" aria-hidden="true">
  <button class="icon-btn close" id="close-detail" aria-label="Chiudi scheda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="detail-in" id="detail-in"></div>
</article>
<div class="toast" id="toast" role="status"></div>
<script src="preview.js"></script>
</body>
</html>
